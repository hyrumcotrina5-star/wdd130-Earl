<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
    <header>
    <div class="logo-nav">
        <img src="images/image t.png" alt="Content Checker Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="contribute.html">Contribute</a>
            <a href="search bar">Search Bar</a>
        </nav>
    </div>
    </header>

    <main>
    <section class="hero">
        <h1>Quickly find books, movies, and songs that match your values.</h1>
        <p>Turn filters on or off to find content that fits your family standards.</p>
    </section>

    <div class="content-layout">

        <aside class="filters">
    <h2>Content Filters</h2>
            <form>
                <label>
                    <input type="checkbox" name="swearing">
                    Swearing
                </label>

                <label>
                    <input type="checkbox" name="Sexual">
                    Sexual / Suggestive Content
                </label>

                <label>
                    <input type="checkbox" name="violence">
                    Violence
                </label>

                <label>
                    <input type="checkbox" name="anger">
                    Excessive Anger
                </label>

                <label>
                    <input type="checkbox" name="substances">
                    Alcohol / Drugs / Substances
                </label>

                <label>
                    <input type="checkbox" name="racism">
                    Racism
                </label>

                <label>
                    <input type="checkbox" name="sexism">
                    Sexism
                </label>

                <label>
                    <input type="checkbox" name="selfharm">
                    Self Harm
                </label>

                <label>
                    <input type="checkbox" name="bodyshaming">
                    Glorified EDs / Body Shaming
                </label>

                <label>
                    <input type="checkbox" name="religious">
                    Religious Focus
                </label>

                <label>
                    <input type="checkbox" name="political">
                    Political
                </label>
            </form>
        </aside>

            <div class="media-types">
                    <img src="images/music-notes.png" alt="Songs">
                    <img src="images/movie-photo.png" alt="Movies">
                    <img src="images/open-book.png" alt="Books">
            </div>


        <section class="results">
            <h2>Title of media</h2>
            <p>Description of media</p>
            <p>Lorem Ipsum</p>
            <p>Filters that apply to this</p>
        </section>

    </div>

    </main>
    
    <footer>
        <p>Copyright</p>
        <a href="contribute.html">Contribute</a>
        <a href="about us.html">About Us</a>
    </footer>

    </body>
    </html>
